[package]
name = "local-transcriber"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
arboard = "3.6"
cpal = "0.15"
crossbeam-channel = "0.5"
directories = "5"
eframe = "0.27"
enigo = "0.6"
global-hotkey = "0.6"
hound = "3.5"
libloading = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tray-icon = { version = "0.23.1", default-features = false }
ureq = "2"
url = "2"
winit = "0.29"
zip = { version = "2", default-features = false, features = ["deflate"] }

[build-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
