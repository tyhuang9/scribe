[package]
name = "local-transcriber"
version = "0.1.0"
edition = "2024"

[features]
ui-harness = []

[dependencies]
anyhow = "1"
arboard = "3.6"
cpal = "0.15"
crossbeam-channel = "0.5"
directories = "5"
eframe = "0.27"
egui-phosphor = "=0.5.0"
global-hotkey = "0.6"
hound = "3.5"
libloading = "0.8"
rusqlite = { version = "0.40.1", features = ["bundled"] }
raw-window-handle = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sherpa-onnx = "=1.13.5"
thiserror = "2"
transcribe-cpp = { version = "=0.1.3", default-features = false }
tray-icon = { version = "0.23.1", default-features = false }
ureq = "2"
unicode-segmentation = "1.12"
url = "2"
winit = "0.29"
zip = { version = "=8.6.0", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
accesskit_windows = "=0.15.1"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_GdiPlus", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_DataExchange", "Win32_System_Diagnostics_Debug", "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_Threading", "Win32_UI_Controls", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[build-dependencies]
cc = "1"
sha2 = "0.10"

[patch.crates-io]
# The upstream build script downloads native archives without authenticating
# them.  This local, version-preserving patch verifies every supported static
# archive before extraction or linking.
sherpa-onnx-sys = { path = "vendor/sherpa-onnx-sys" }
