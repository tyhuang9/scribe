[package]
name = "scribe-windows-gpu-promotion-broker"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
publish = false

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_LibraryLoader", "Win32_System_Pipes", "Win32_System_Registry", "Win32_System_Services", "Win32_System_Threading"] }

[dev-dependencies]
ring = "0.17"
tempfile = "3"

[[bin]]
name = "scribe-windows-gpu-promotion-client"
path = "src/main.rs"

[[bin]]
name = "scribe-windows-gpu-promotion-service"
path = "src/bin/scribe-windows-gpu-promotion-service.rs"

[workspace]
