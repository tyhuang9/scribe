name: Promote Windows GPU worker packs

on:
  pull_request:
    paths:
      - '.github/workflows/windows-gpu-pack-promotion.yml'
      - '.github/workflows/windows-gpu-signer-tool.yml'
      - 'scripts/invoke-windows-gpu-approved-signing.ps1'
      - 'scripts/test-windows-gpu-approved-signing.ps1'
      - 'scripts/test-windows-gpu-signing-policy.ps1'
      - 'runtime-manifests/windows-gpu-signing-policy.json'
      - 'runtime-manifests/worker-pack-production-trust.json'
      - 'src/windows_gpu_approved_signing.rs'
      - 'scripts/promote-windows-gpu-worker-packs.ps1'
      - 'scripts/test-windows-gpu-pack-promotion.ps1'
      - 'scripts/test-windows-gpu-broker-transport.ps1'
      - 'scripts/provision-windows-gpu-broker-client-policy.ps1'
      - 'scripts/build-windows-gpu-worker-pack.ps1'
      - 'scripts/build-windows-vulkan-policy-loader.ps1'
      - 'scripts/windows-vulkan-policy-pack.ps1'
      - 'native/vulkan-policy-loader/**'
      - 'runtime-manifests/gpu-worker-toolchain-windows-x64.json'
      - 'src/worker_pack_authoring.rs'
      - 'tools/worker-pack-author/**'
      - 'tools/windows-gpu-promotion-broker/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/windows-gpu-pack-promotion.yml'
      - '.github/workflows/windows-gpu-signer-tool.yml'
      - 'scripts/invoke-windows-gpu-approved-signing.ps1'
      - 'scripts/test-windows-gpu-approved-signing.ps1'
      - 'scripts/test-windows-gpu-signing-policy.ps1'
      - 'runtime-manifests/windows-gpu-signing-policy.json'
      - 'runtime-manifests/worker-pack-production-trust.json'
      - 'src/windows_gpu_approved_signing.rs'
      - 'scripts/promote-windows-gpu-worker-packs.ps1'
      - 'scripts/test-windows-gpu-pack-promotion.ps1'
      - 'scripts/test-windows-gpu-broker-transport.ps1'
      - 'scripts/provision-windows-gpu-broker-client-policy.ps1'
      - 'scripts/build-windows-gpu-worker-pack.ps1'
      - 'scripts/build-windows-vulkan-policy-loader.ps1'
      - 'scripts/windows-vulkan-policy-pack.ps1'
      - 'native/vulkan-policy-loader/**'
      - 'runtime-manifests/gpu-worker-toolchain-windows-x64.json'
      - 'src/worker_pack_authoring.rs'
      - 'tools/worker-pack-author/**'
      - 'tools/windows-gpu-promotion-broker/**'
  workflow_dispatch:
    inputs:
      operation:
        description: Prepare a pair, or approve/sign a separately completed prepare run.
        required: true
        type: choice
        options: [prepare, sign]
        default: prepare
      producer_run_id:
        description: Completed prepare workflow run ID (sign only).
        type: string
      producer_run_attempt:
        description: Completed prepare run attempt (sign only).
        type: string
      unsigned_artifact_id:
        description: Exact unsigned artifact ID from that prepare run (sign only).
        type: string
      pack_version:
        description: Canonical immutable worker-pack version.
        required: false
        type: string

permissions:
  contents: read

jobs:
  contract:
    name: Validate unprivileged promotion contract
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@01ba1edad32c6f80dbcce879d3e0fa5a00b2a84e # 1.96.0 branch reviewed 2026-08-27
      - name: Fetch locked worker-pack tool dependencies
        shell: pwsh
        run: |
          cargo fetch --locked --manifest-path tools/worker-pack-author/Cargo.toml
          cargo fetch --locked --manifest-path tools/windows-gpu-promotion-broker/Cargo.toml
      - name: Test unsigned handoff and fixture-only atomic promotion
        shell: pwsh
        run: |
          $revision = (git rev-parse --verify HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $revision -cnotmatch '\A[0-9a-f]{40}\z' -or $revision -cne $env:GITHUB_SHA) { throw 'Contract checkout does not match the workflow source revision.' }
          $env:SCRIBE_BUILD_REVISION = $revision
          pwsh -NoProfile -File .\scripts\test-windows-gpu-pack-promotion.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Promotion contract failed.' }
          pwsh -NoProfile -File .\scripts\test-windows-gpu-approved-signing.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Approved signing orchestration failed.' }
          cargo test --locked --offline --manifest-path tools/worker-pack-author/Cargo.toml -- --test-threads=1
          if ($LASTEXITCODE -ne 0) { throw 'Approved signing core tests failed.' }
          cargo test --locked --offline --manifest-path tools/windows-gpu-promotion-broker/Cargo.toml -- --test-threads=1
      - name: Check monotonic reviewed signing epochs
        shell: pwsh
        env:
          BASE_REVISION: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          $base = $env:BASE_REVISION
          if ($base -cnotmatch '^[0-9a-f]{40}$' -or $base -eq ('0' * 40)) {
            $base = (git rev-parse --verify HEAD^).Trim()
            if ($LASTEXITCODE -ne 0) { throw 'Cannot resolve immutable signing policy base.' }
          }
          pwsh -NoProfile -File .\scripts\test-windows-gpu-signing-policy.ps1 -BaseRevision $base
          if ($LASTEXITCODE -ne 0) { throw 'Signing epoch policy rejected.' }
      - name: Test fixed authenticated no-authority broker transport
        shell: pwsh
        run: pwsh -NoProfile -File .\scripts\test-windows-gpu-broker-transport.ps1 -RequireScmIntegration

  prepare-unsigned:
    name: Prepare unsigned CUDA and Vulkan handoff
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'prepare' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: contract
    runs-on: [self-hosted, Windows, X64, scribe-gpu-pack-builder]
    timeout-minutes: 180
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
      handoff_sha256: ${{ steps.handoff.outputs.handoff_sha256 }}
      release_set_digest: ${{ steps.handoff.outputs.release_set_digest }}
      toolchain_manifest_sha256: ${{ steps.handoff.outputs.toolchain_manifest_sha256 }}
      pack_version: ${{ steps.handoff.outputs.pack_version }}
      source_revision: ${{ steps.identity.outputs.source_revision }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Bind exact reviewed default-branch source
        id: identity
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -cne "refs/heads/$env:GITHUB_DEFAULT_BRANCH") { throw 'Unsigned handoff must originate from the default branch.' }
          $revision = (git rev-parse --verify HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $revision -cne $env:GITHUB_SHA -or $revision -cnotmatch '^[0-9a-f]{40}$') { throw 'Checkout revision does not match the workflow source revision.' }
          "source_revision=$revision" >> $env:GITHUB_OUTPUT
        env:
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      - name: Build exact unsigned release candidates
        id: build
        shell: pwsh
        env:
          PACK_VERSION: ${{ inputs.pack_version }}
        run: |
          if ($env:PACK_VERSION -cnotmatch '^[a-z0-9](?:[a-z0-9._-]{0,94}[a-z0-9])?$') { throw 'Pack version is not a canonical immutable store component.' }
          $root = Join-Path $env:RUNNER_TEMP 'scribe-windows-gpu-unsigned'
          if (Test-Path -LiteralPath $root) { throw 'Unsigned handoff root must be fresh.' }
          New-Item -ItemType Directory -Path $root | Out-Null
          $policy = Get-Content -LiteralPath 'runtime-manifests/windows-gpu-signing-policy.json' -Raw | ConvertFrom-Json
          $cudaEpoch = @($policy.packs | Where-Object backend -CEQ 'cuda')[0].security_epoch
          $vulkanEpoch = @($policy.packs | Where-Object backend -CEQ 'vulkan')[0].security_epoch
          $cuda = & .\scripts\build-windows-gpu-worker-pack.ps1 -Backend Cuda -SecurityEpoch $cudaEpoch -PackVersion $env:PACK_VERSION -OutputDirectory (Join-Path $root 'cuda') -SigningMode Prepared
          $vulkan = & .\scripts\build-windows-gpu-worker-pack.ps1 -Backend Vulkan -SecurityEpoch $vulkanEpoch -PackVersion $env:PACK_VERSION -OutputDirectory (Join-Path $root 'vulkan') -SigningMode Prepared
          $cuda | ConvertTo-Json -Depth 6 -Compress | Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'cuda-descriptor.json') -Encoding utf8NoBOM
          $vulkan | ConvertTo-Json -Depth 6 -Compress | Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'vulkan-descriptor.json') -Encoding utf8NoBOM
          "handoff_root=$root" >> $env:GITHUB_OUTPUT
      - name: Create canonical source and release-set handoff
        id: handoff
        shell: pwsh
        env:
          HANDOFF_ROOT: ${{ steps.build.outputs.handoff_root }}
          SOURCE_REVISION: ${{ steps.identity.outputs.source_revision }}
          PACK_VERSION: ${{ inputs.pack_version }}
        run: |
          $cuda = Get-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'cuda-descriptor.json') -Raw | ConvertFrom-Json
          $vulkan = Get-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'vulkan-descriptor.json') -Raw | ConvertFrom-Json
          if ($cuda.SourceRevision -cne $env:SOURCE_REVISION -or $vulkan.SourceRevision -cne $env:SOURCE_REVISION -or $cuda.ToolchainManifestSha256 -cne $vulkan.ToolchainManifestSha256) { throw 'Prepared packs do not share the exact source and toolchain contract.' }
          $packs = @(
            [ordered]@{ backend = 'cuda'; pack_root = 'cuda'; pack_id = $cuda.PackId; pack_version = $cuda.PackVersion; pack_digest = $cuda.PackDigest; security_epoch = [uint64]$cuda.SecurityEpoch; provider = $cuda.Provider; manifest_sha256 = $cuda.ManifestSha256 },
            [ordered]@{ backend = 'vulkan'; pack_root = 'vulkan'; pack_id = $vulkan.PackId; pack_version = $vulkan.PackVersion; pack_digest = $vulkan.PackDigest; security_epoch = [uint64]$vulkan.SecurityEpoch; provider = $vulkan.Provider; manifest_sha256 = $vulkan.ManifestSha256 }
          )
          $material = [ordered]@{ schema_version = 1; source_repository = $env:GITHUB_REPOSITORY; source_ref = $env:GITHUB_REF; source_revision = $env:SOURCE_REVISION; workflow_ref = $env:GITHUB_WORKFLOW_REF; run_id = $env:GITHUB_RUN_ID; run_attempt = $env:GITHUB_RUN_ATTEMPT; pack_version = $env:PACK_VERSION; toolchain_manifest_sha256 = $cuda.ToolchainManifestSha256; packs = $packs }
          $materialJson = $material | ConvertTo-Json -Depth 8 -Compress
          $bytes = [Text.Encoding]::UTF8.GetBytes("scribe-windows-gpu-release-set-v1`0$materialJson")
          $releaseSetDigest = ([BitConverter]::ToString([Security.Cryptography.SHA256]::Create().ComputeHash($bytes))).Replace('-', '').ToLowerInvariant()
          $handoff = [ordered]@{} + $material
          $handoff.release_set_digest = $releaseSetDigest
          $handoffPath = Join-Path $env:HANDOFF_ROOT 'windows-gpu-pack-handoff.json'
          [IO.File]::WriteAllText($handoffPath, ($handoff | ConvertTo-Json -Depth 8 -Compress), [Text.UTF8Encoding]::new($false))
          $handoffSha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath $handoffPath).Hash.ToLowerInvariant()
          "handoff_sha256=$handoffSha256" >> $env:GITHUB_OUTPUT
          "release_set_digest=$releaseSetDigest" >> $env:GITHUB_OUTPUT
          "toolchain_manifest_sha256=$($cuda.ToolchainManifestSha256)" >> $env:GITHUB_OUTPUT
          "pack_version=$env:PACK_VERSION" >> $env:GITHUB_OUTPUT
      - name: Upload exact unsigned handoff
        id: upload
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: windows-gpu-unsigned-${{ github.run_id }}
          path: ${{ steps.build.outputs.handoff_root }}
          if-no-files-found: error
          retention-days: 7
  preflight-signing:
    name: Inspect exact pair and current policy without secrets
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'sign' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: contract
    runs-on: windows-2022
    permissions:
      contents: read
      actions: read
    timeout-minutes: 15
    outputs:
      approval_artifact_id: ${{ steps.approval-upload.outputs.artifact-id }}
      approval_sha256: ${{ steps.inspect.outputs.approval_sha256 }}
      signer_pins_sha256: ${{ steps.inspect.outputs.signer_pins_sha256 }}
    env:
      SCRIBE_GPU_SIGNER_SOURCE_SHA: ${{ vars.SCRIBE_GPU_SIGNER_SOURCE_SHA }}
      SCRIBE_GPU_SIGNER_RUN_ID: ${{ vars.SCRIBE_GPU_SIGNER_RUN_ID }}
      SCRIBE_GPU_SIGNER_RUN_ATTEMPT: ${{ vars.SCRIBE_GPU_SIGNER_RUN_ATTEMPT }}
      SCRIBE_GPU_SIGNER_ARTIFACT_ID: ${{ vars.SCRIBE_GPU_SIGNER_ARTIFACT_ID }}
      SCRIBE_GPU_SIGNER_ARTIFACT_SHA256: ${{ vars.SCRIBE_GPU_SIGNER_ARTIFACT_SHA256 }}
      SCRIBE_GPU_SIGNER_BINARY_SHA256: ${{ vars.SCRIBE_GPU_SIGNER_BINARY_SHA256 }}
      SCRIBE_GPU_SIGNER_WRAPPER_SHA256: ${{ vars.SCRIBE_GPU_SIGNER_WRAPPER_SHA256 }}
    steps:
      - name: Download independently reviewed signer bundle by immutable ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          repository: tyhuang9/scribe
          run-id: ${{ vars.SCRIBE_GPU_SIGNER_RUN_ID }}
          artifact-ids: ${{ vars.SCRIBE_GPU_SIGNER_ARTIFACT_ID }}
          digest-mismatch: error
          path: ${{ runner.temp }}/scribe-approved-signer
      - name: Authenticate wrapper before its first execution
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          $root = Join-Path $env:RUNNER_TEMP 'scribe-approved-signer'
          $expected = @{
            'invoke-windows-gpu-approved-signing.ps1' = $env:SCRIBE_GPU_SIGNER_WRAPPER_SHA256
            'scribe-worker-pack-tool.exe' = $env:SCRIBE_GPU_SIGNER_BINARY_SHA256
          }
          $entries = @(Get-ChildItem -LiteralPath $root -Force)
          if ($entries.Count -ne 2) { throw 'Signer bundle inventory differs from the reviewed two-file contract.' }
          foreach ($entry in $entries) {
            if (-not $expected.ContainsKey($entry.Name) -or $expected[$entry.Name] -cnotmatch '^[0-9a-f]{64}$') { throw 'Signer file or independent pin is missing.' }
            if ($entry.PSIsContainer -or $entry.Length -le 0 -or $entry.Length -gt 67108864 -or $entry.LinkType) { throw 'Signer payload is not a bounded unlinked regular file.' }
            $cursor = $entry.FullName
            while ($cursor) {
              $item = Get-Item -LiteralPath $cursor -Force
              if (($item.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) { throw 'Signer bundle traverses a reparse point.' }
              $parent = Split-Path -Parent $cursor
              if ($parent -eq $cursor) { break }
              $cursor = $parent
            }
            $streams = @(Get-Item -LiteralPath $entry.FullName -Stream *)
            if ($streams.Count -ne 1 -or $streams[0].Stream -cne ':$DATA') { throw 'Signer file has alternate streams.' }
            if ((Get-FileHash -LiteralPath $entry.FullName -Algorithm SHA256).Hash.ToLowerInvariant() -cne $expected[$entry.Name]) { throw 'Signer bundle digest differs from its independent pin.' }
          }
      - name: Download exact unsigned candidate as data only
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          repository: tyhuang9/scribe
          run-id: ${{ inputs.producer_run_id }}
          artifact-ids: ${{ inputs.unsigned_artifact_id }}
          digest-mismatch: error
          path: ${{ runner.temp }}/scribe-windows-gpu-handoff
      - name: Resolve authenticated provenance and exact approval
        id: inspect
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCER_RUN_ID: ${{ inputs.producer_run_id }}
          PRODUCER_RUN_ATTEMPT: ${{ inputs.producer_run_attempt }}
          UNSIGNED_ARTIFACT_ID: ${{ inputs.unsigned_artifact_id }}
        run: |
          & (Join-Path $env:RUNNER_TEMP 'scribe-approved-signer/invoke-windows-gpu-approved-signing.ps1') -Mode Preflight -HandoffRoot (Join-Path $env:RUNNER_TEMP 'scribe-windows-gpu-handoff') -ApprovalRoot (Join-Path $env:RUNNER_TEMP 'scribe-gpu-approval') -ProducerRunId $env:PRODUCER_RUN_ID -ProducerRunAttempt $env:PRODUCER_RUN_ATTEMPT -ArtifactId $env:UNSIGNED_ARTIFACT_ID
      - name: Upload the exact non-secret approval and policy
        id: approval-upload
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: windows-gpu-approval-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/scribe-gpu-approval
          if-no-files-found: error
          retention-days: 7

  protected-promote:
    name: Sign only the maintainer-approved exact pack pair
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'sign' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: preflight-signing
    # A fresh GitHub-hosted VM, never a persistent candidate-builder or broker.
    # PowerShell path probes and retained leaf handles do not
    # provide no-follow open semantics or pin path ancestors. This assumes a
    # fresh trusted job without candidate execution or untrusted concurrent writers.
    runs-on: windows-2022
    environment: windows-gpu-pack-signing
    permissions:
      contents: read
      actions: read
    concurrency:
      group: windows-gpu-pack-signing
      cancel-in-progress: false
    timeout-minutes: 15
    env:
      EXPECTED_APPROVAL_SHA256: ${{ needs.preflight-signing.outputs.approval_sha256 }}
      EXPECTED_SIGNER_PINS_SHA256: ${{ needs.preflight-signing.outputs.signer_pins_sha256 }}
    steps:
      - name: Download independently reviewed signer bundle by immutable ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          repository: tyhuang9/scribe
          run-id: ${{ vars.SCRIBE_GPU_APPROVED_SIGNER_RUN_ID }}
          artifact-ids: ${{ vars.SCRIBE_GPU_APPROVED_SIGNER_ARTIFACT_ID }}
          digest-mismatch: error
          path: ${{ runner.temp }}/scribe-approved-signer
      - name: Authenticate wrapper before its first execution
        shell: pwsh
        env:
          SCRIBE_GPU_SIGNER_SOURCE_SHA: ${{ vars.SCRIBE_GPU_APPROVED_SIGNER_SOURCE_SHA }}
          SCRIBE_GPU_SIGNER_RUN_ID: ${{ vars.SCRIBE_GPU_APPROVED_SIGNER_RUN_ID }}
          SCRIBE_GPU_SIGNER_RUN_ATTEMPT: ${{ vars.SCRIBE_GPU_APPROVED_SIGNER_RUN_ATTEMPT }}
          SCRIBE_GPU_SIGNER_ARTIFACT_ID: ${{ vars.SCRIBE_GPU_APPROVED_SIGNER_ARTIFACT_ID }}
          SCRIBE_GPU_SIGNER_ARTIFACT_SHA256: ${{ vars.SCRIBE_GPU_APPROVED_SIGNER_ARTIFACT_SHA256 }}
          SCRIBE_GPU_SIGNER_BINARY_SHA256: ${{ vars.SCRIBE_GPU_APPROVED_SIGNER_BINARY_SHA256 }}
          SCRIBE_GPU_SIGNER_WRAPPER_SHA256: ${{ vars.SCRIBE_GPU_APPROVED_SIGNER_WRAPPER_SHA256 }}
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          $root = Join-Path $env:RUNNER_TEMP 'scribe-approved-signer'
          $expected = @{
            'invoke-windows-gpu-approved-signing.ps1' = $env:SCRIBE_GPU_SIGNER_WRAPPER_SHA256
            'scribe-worker-pack-tool.exe' = $env:SCRIBE_GPU_SIGNER_BINARY_SHA256
          }
          $entries = @(Get-ChildItem -LiteralPath $root -Force)
          if ($entries.Count -ne 2) { throw 'Signer bundle inventory differs from the reviewed two-file contract.' }
          foreach ($entry in $entries) {
            if (-not $expected.ContainsKey($entry.Name) -or $expected[$entry.Name] -cnotmatch '^[0-9a-f]{64}$') { throw 'Signer file or independent pin is missing.' }
            if ($entry.PSIsContainer -or $entry.Length -le 0 -or $entry.Length -gt 67108864 -or $entry.LinkType) { throw 'Signer payload is not a bounded unlinked regular file.' }
            $cursor = $entry.FullName
            while ($cursor) {
              $item = Get-Item -LiteralPath $cursor -Force
              if (($item.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) { throw 'Signer bundle traverses a reparse point.' }
              $parent = Split-Path -Parent $cursor
              if ($parent -eq $cursor) { break }
              $cursor = $parent
            }
            $streams = @(Get-Item -LiteralPath $entry.FullName -Stream *)
            if ($streams.Count -ne 1 -or $streams[0].Stream -cne ':$DATA') { throw 'Signer file has alternate streams.' }
            if ((Get-FileHash -LiteralPath $entry.FullName -Algorithm SHA256).Hash.ToLowerInvariant() -cne $expected[$entry.Name]) { throw 'Signer bundle digest differs from its independent pin.' }
          }
      - name: Download exact unsigned candidate as data only
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          repository: tyhuang9/scribe
          run-id: ${{ inputs.producer_run_id }}
          artifact-ids: ${{ inputs.unsigned_artifact_id }}
          digest-mismatch: error
          path: ${{ runner.temp }}/scribe-windows-gpu-handoff
      - name: Download exact preflight approval
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.preflight-signing.outputs.approval_artifact_id }}
          digest-mismatch: error
          path: ${{ runner.temp }}/scribe-gpu-approval
      - name: Revalidate policy and sign with memory-only protected authority
        shell: pwsh
        env:
          SCRIBE_GPU_SIGNER_SOURCE_SHA: ${{ vars.SCRIBE_GPU_APPROVED_SIGNER_SOURCE_SHA }}
          SCRIBE_GPU_SIGNER_RUN_ID: ${{ vars.SCRIBE_GPU_APPROVED_SIGNER_RUN_ID }}
          SCRIBE_GPU_SIGNER_RUN_ATTEMPT: ${{ vars.SCRIBE_GPU_APPROVED_SIGNER_RUN_ATTEMPT }}
          SCRIBE_GPU_SIGNER_ARTIFACT_ID: ${{ vars.SCRIBE_GPU_APPROVED_SIGNER_ARTIFACT_ID }}
          SCRIBE_GPU_SIGNER_ARTIFACT_SHA256: ${{ vars.SCRIBE_GPU_APPROVED_SIGNER_ARTIFACT_SHA256 }}
          SCRIBE_GPU_SIGNER_BINARY_SHA256: ${{ vars.SCRIBE_GPU_APPROVED_SIGNER_BINARY_SHA256 }}
          SCRIBE_GPU_SIGNER_WRAPPER_SHA256: ${{ vars.SCRIBE_GPU_APPROVED_SIGNER_WRAPPER_SHA256 }}
          GH_TOKEN: ${{ github.token }}
          SCRIBE_GPU_PACK_PRIVATE_KEY_BASE64: ${{ secrets.SCRIBE_GPU_PACK_PRIVATE_KEY_BASE64 }}
        run: |
          & (Join-Path $env:RUNNER_TEMP 'scribe-approved-signer/invoke-windows-gpu-approved-signing.ps1') -Mode Sign -HandoffRoot (Join-Path $env:RUNNER_TEMP 'scribe-windows-gpu-handoff') -ApprovalRoot (Join-Path $env:RUNNER_TEMP 'scribe-gpu-approval') -OutputRoot (Join-Path $env:RUNNER_TEMP 'scribe-windows-gpu-promoted') -ExpectedApprovalSha256 $env:EXPECTED_APPROVAL_SHA256 -ExpectedSignerPinsSha256 $env:EXPECTED_SIGNER_PINS_SHA256
      - name: Recheck current policy immediately before artifact publication
        shell: pwsh
        env:
          SCRIBE_GPU_SIGNER_SOURCE_SHA: ${{ vars.SCRIBE_GPU_APPROVED_SIGNER_SOURCE_SHA }}
          SCRIBE_GPU_SIGNER_RUN_ID: ${{ vars.SCRIBE_GPU_APPROVED_SIGNER_RUN_ID }}
          SCRIBE_GPU_SIGNER_RUN_ATTEMPT: ${{ vars.SCRIBE_GPU_APPROVED_SIGNER_RUN_ATTEMPT }}
          SCRIBE_GPU_SIGNER_ARTIFACT_ID: ${{ vars.SCRIBE_GPU_APPROVED_SIGNER_ARTIFACT_ID }}
          SCRIBE_GPU_SIGNER_ARTIFACT_SHA256: ${{ vars.SCRIBE_GPU_APPROVED_SIGNER_ARTIFACT_SHA256 }}
          SCRIBE_GPU_SIGNER_BINARY_SHA256: ${{ vars.SCRIBE_GPU_APPROVED_SIGNER_BINARY_SHA256 }}
          SCRIBE_GPU_SIGNER_WRAPPER_SHA256: ${{ vars.SCRIBE_GPU_APPROVED_SIGNER_WRAPPER_SHA256 }}
          GH_TOKEN: ${{ github.token }}
        run: |
          & (Join-Path $env:RUNNER_TEMP 'scribe-approved-signer/invoke-windows-gpu-approved-signing.ps1') -Mode PublicationCheck -ApprovalRoot (Join-Path $env:RUNNER_TEMP 'scribe-gpu-approval') -OutputRoot (Join-Path $env:RUNNER_TEMP 'scribe-windows-gpu-promoted') -ExpectedApprovalSha256 $env:EXPECTED_APPROVAL_SHA256 -ExpectedSignerPinsSha256 $env:EXPECTED_SIGNER_PINS_SHA256
      - name: Upload signed pair without activation or Auto enablement
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: windows-gpu-signed-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/scribe-windows-gpu-promoted
          if-no-files-found: error
          retention-days: 7
