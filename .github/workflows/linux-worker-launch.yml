name: Test Linux worker launcher

on:
  push:
    paths:
      - '.github/workflows/linux-worker-launch.yml'
      - '.gitattributes'
      - 'build.rs'
      - 'build_support/build_revision.rs'
      - 'build_support/linux_release_authority.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'runtime-manifests/linux-worker-install-contract-x86_64.json'
      - 'runtime-manifests/gpu-auto-qualification-linux-x86_64.json'
      - 'runtime-manifests/gpu-pack-release-authority-linux-empty.json'
      - 'docs/LINUX_GPU_ROUTING.md'
      - 'docs/LINUX_WORKER_LAUNCH.md'
      - 'docs/LINUX_RELEASE_PACKAGING.md'
      - 'scripts/*linux*release*'
      - 'scripts/*linux*worker*'
      - 'scripts/*linux*cpu*'
      - 'scripts/inspect-linux-deb.py'
      - 'scripts/linux-worker-launch-fixture.rs'
      - 'scripts/linux-gpu-typecheck/**'
      - 'scripts/test-linux-worker-launch.sh'
      - 'src/**'
      - 'tools/worker-pack-author/Cargo.toml'
      - 'tools/worker-pack-author/src/main.rs'
      - 'vendor/sherpa-onnx-sys/**'
  pull_request:
    paths:
      - '.github/workflows/linux-worker-launch.yml'
      - '.gitattributes'
      - 'build.rs'
      - 'build_support/build_revision.rs'
      - 'build_support/linux_release_authority.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'runtime-manifests/linux-worker-install-contract-x86_64.json'
      - 'runtime-manifests/gpu-auto-qualification-linux-x86_64.json'
      - 'runtime-manifests/gpu-pack-release-authority-linux-empty.json'
      - 'docs/LINUX_GPU_ROUTING.md'
      - 'docs/LINUX_WORKER_LAUNCH.md'
      - 'docs/LINUX_RELEASE_PACKAGING.md'
      - 'scripts/*linux*release*'
      - 'scripts/*linux*worker*'
      - 'scripts/*linux*cpu*'
      - 'scripts/inspect-linux-deb.py'
      - 'scripts/linux-worker-launch-fixture.rs'
      - 'scripts/linux-gpu-typecheck/**'
      - 'scripts/test-linux-worker-launch.sh'
      - 'src/**'
      - 'tools/worker-pack-author/Cargo.toml'
      - 'tools/worker-pack-author/src/main.rs'
      - 'vendor/sherpa-onnx-sys/**'

permissions:
  contents: read

jobs:
  launcher:
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@01ba1edad32c6f80dbcce879d3e0fa5a00b2a84e # 1.96.0 branch reviewed 2026-08-27
      - name: Install Linux desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes libasound2-dev libglib2.0-dev libgtk-3-dev pkg-config
      - name: Check actual Linux application and worker crates
        env:
          CARGO_INCREMENTAL: 0
          CARGO_TARGET_DIR: target/linux-application-check
          DOCS_RS: '1'
        run: |
          cargo check --locked --bin local-transcriber --features ui-harness
          cargo check --locked --bin scribe-inference-worker --features inference-worker
      - name: Fetch worker-pack authority test dependencies
        run: cargo fetch --locked --manifest-path tools/worker-pack-author/Cargo.toml
      - name: Test descriptor-bound Linux worker launch
        run: ./scripts/test-linux-worker-launch.sh
      - name: Test reviewed Linux CPU input rejection without network access
        run: bash scripts/test-linux-release-inputs.sh
      - name: Test Linux CPU baseline evidence rejection without network access
        run: python3 -B scripts/test-linux-cpu-native-baseline.py
      - name: Prepare reviewed Linux CPU native input
        run: bash scripts/prepare-linux-release-inputs.sh --output-directory "$RUNNER_TEMP/scribe-reviewed-linux-native"
      - name: Fetch locked application dependencies for offline native builds
        run: cargo fetch --locked
      - name: Build and test actual CPU worker and desktop, then verify their Debian package
        env:
          SHERPA_ONNX_ARCHIVE_DIR: ${{ runner.temp }}/scribe-reviewed-linux-native
        run: bash scripts/test-linux-native-cpu-worker.sh
      - name: Type-check the feature-enabled Linux Vulkan identity branch
        env:
          CARGO_TARGET_DIR: target/linux-gpu-typecheck
          RUSTFLAGS: -Dwarnings
        run: cargo check --locked --manifest-path scripts/linux-gpu-typecheck/Cargo.toml --features vulkan-acceleration
      - name: Type-check the feature-enabled Linux CUDA identity branch
        env:
          CARGO_TARGET_DIR: target/linux-gpu-typecheck
          RUSTFLAGS: -Dwarnings
        run: cargo check --locked --manifest-path scripts/linux-gpu-typecheck/Cargo.toml --features cuda-acceleration
