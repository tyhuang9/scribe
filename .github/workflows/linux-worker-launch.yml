name: Test Linux worker launcher

on:
  push:
    paths:
      - '.github/workflows/linux-worker-launch.yml'
      - '.gitattributes'
      - 'build.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'runtime-manifests/linux-worker-install-contract-x86_64.json'
      - 'runtime-manifests/gpu-auto-qualification-linux-x86_64.json'
      - 'docs/LINUX_GPU_ROUTING.md'
      - 'scripts/linux-worker-launch-fixture.rs'
      - 'scripts/test-linux-worker-launch.sh'
      - 'src/linux_gpu.rs'
      - 'src/linux_gpu_architecture_guard.rs'
      - 'src/linux_worker_architecture_guard.rs'
      - 'src/linux_worker_launch.rs'
      - 'src/onnx_worker.rs'
      - 'src/gpu_worker_pack/mod.rs'
      - 'src/main.rs'
      - 'src/bin/scribe-inference-worker.rs'
  pull_request:
    paths:
      - '.github/workflows/linux-worker-launch.yml'
      - '.gitattributes'
      - 'build.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'runtime-manifests/linux-worker-install-contract-x86_64.json'
      - 'runtime-manifests/gpu-auto-qualification-linux-x86_64.json'
      - 'docs/LINUX_GPU_ROUTING.md'
      - 'scripts/linux-worker-launch-fixture.rs'
      - 'scripts/test-linux-worker-launch.sh'
      - 'src/linux_gpu.rs'
      - 'src/linux_gpu_architecture_guard.rs'
      - 'src/linux_worker_architecture_guard.rs'
      - 'src/linux_worker_launch.rs'
      - 'src/onnx_worker.rs'
      - 'src/gpu_worker_pack/mod.rs'
      - 'src/main.rs'
      - 'src/bin/scribe-inference-worker.rs'

permissions:
  contents: read

jobs:
  launcher:
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@01ba1edad32c6f80dbcce879d3e0fa5a00b2a84e # 1.96.0 branch reviewed 2026-08-27
      - name: Test descriptor-bound Linux worker launch
        run: ./scripts/test-linux-worker-launch.sh
