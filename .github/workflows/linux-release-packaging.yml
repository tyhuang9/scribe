name: Test Linux release packaging

on:
  push:
    paths:
      - '.github/workflows/linux-release-packaging.yml'
      - '.gitattributes'
      - 'build.rs'
      - 'runtime-manifests/linux-release-package-x86_64.json'
      - 'runtime-manifests/gpu-auto-qualification-linux-x86_64.json'
      - 'scripts/build-linux-release-package.sh'
      - 'scripts/linux-release-package-common.sh'
      - 'scripts/verify-linux-release-package.sh'
      - 'scripts/report-linux-worker-pack-sizes.sh'
      - 'scripts/test-linux-release-packaging.sh'
      - 'src/gpu_worker_pack/manifest.rs'
      - 'src/gpu_worker_pack/store.rs'
      - 'src/worker_pack_authoring.rs'
      - 'src/worker_identity.rs'
      - 'tools/worker-pack-author/**'
      - 'docs/LINUX_RELEASE_PACKAGING.md'
      - 'docs/LINUX_WORKER_LAUNCH.md'
      - 'docs/GPU_WORKER_PACKS.md'
  pull_request:
    paths:
      - '.github/workflows/linux-release-packaging.yml'
      - '.gitattributes'
      - 'build.rs'
      - 'runtime-manifests/linux-release-package-x86_64.json'
      - 'runtime-manifests/gpu-auto-qualification-linux-x86_64.json'
      - 'scripts/build-linux-release-package.sh'
      - 'scripts/linux-release-package-common.sh'
      - 'scripts/verify-linux-release-package.sh'
      - 'scripts/report-linux-worker-pack-sizes.sh'
      - 'scripts/test-linux-release-packaging.sh'
      - 'src/gpu_worker_pack/manifest.rs'
      - 'src/gpu_worker_pack/store.rs'
      - 'src/worker_pack_authoring.rs'
      - 'src/worker_identity.rs'
      - 'tools/worker-pack-author/**'
      - 'docs/LINUX_RELEASE_PACKAGING.md'
      - 'docs/LINUX_WORKER_LAUNCH.md'
      - 'docs/GPU_WORKER_PACKS.md'

permissions:
  contents: read

jobs:
  package:
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@01ba1edad32c6f80dbcce879d3e0fa5a00b2a84e # 1.96.0 branch reviewed 2026-08-27
      - name: Test deterministic fail-closed Debian packaging
        run: ./scripts/test-linux-release-packaging.sh
      - name: Test author, verifier, immutable store, activation, and rollback
        env:
          SCRIBE_BUILD_REVISION: ${{ github.sha }}
        run: cargo test --locked --manifest-path tools/worker-pack-author/Cargo.toml -- --test-threads=1
