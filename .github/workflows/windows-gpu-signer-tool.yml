name: Build independently reviewed Windows GPU signer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-tool:
    # No source/ref input: only a reviewed commit already on the protected default branch.
    if: github.ref == 'refs/heads/main' && github.repository == 'tyhuang9/scribe'
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@01ba1edad32c6f80dbcce879d3e0fa5a00b2a84e # 1.96.0
      - name: Build and test the locked authority-free tool
        shell: pwsh
        env:
          SCRIBE_BUILD_REVISION: ${{ github.sha }}
          CARGO_TARGET_DIR: ${{ runner.temp }}/scribe-approved-signer-target
          RUSTFLAGS: -C target-feature=+crt-static
        run: |
          $ErrorActionPreference = 'Stop'
          $revision = (git rev-parse --verify HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $revision -cne $env:GITHUB_SHA -or $revision -cnotmatch '^[0-9a-f]{40}$') { throw 'Signer checkout is not the exact workflow source.' }
          if (Test-Path -LiteralPath $env:CARGO_TARGET_DIR) { throw 'Signer tool target must be fresh.' }
          cargo test --locked --manifest-path tools/worker-pack-author/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw 'Signer unit tests failed.' }
          cargo build --locked --offline --release --manifest-path tools/worker-pack-author/Cargo.toml --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw 'Signer tool build failed.' }
          pwsh -NoProfile -File .\scripts\test-windows-gpu-approved-signing.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Signer wrapper contract failed.' }
          $bundle = Join-Path $env:RUNNER_TEMP 'scribe-reviewed-signer-bundle'
          if (Test-Path -LiteralPath $bundle) { throw 'Signer bundle output must be fresh.' }
          New-Item -ItemType Directory -Path $bundle | Out-Null
          Copy-Item -LiteralPath (Join-Path $env:CARGO_TARGET_DIR 'x86_64-pc-windows-msvc/release/scribe-worker-pack-tool.exe') -Destination $bundle
          Copy-Item -LiteralPath 'scripts/invoke-windows-gpu-approved-signing.ps1' -Destination $bundle
          "## Candidate trusted signer bundle (not automatically trusted)" >> $env:GITHUB_STEP_SUMMARY
          "Source revision: $revision" >> $env:GITHUB_STEP_SUMMARY
          "Run / attempt: $env:GITHUB_RUN_ID / $env:GITHUB_RUN_ATTEMPT" >> $env:GITHUB_STEP_SUMMARY
          foreach ($file in Get-ChildItem -LiteralPath $bundle -File) {
            "$($file.Name): $((Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant())" >> $env:GITHUB_STEP_SUMMARY
          }
          'Maintainers must independently review this exact source and bundle before configuring both repository and protected-environment pins. This workflow never configures trust or receives a signing key.' >> $env:GITHUB_STEP_SUMMARY
      - name: Publish exact two-file tool bundle for independent pinning
        id: upload
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: windows-gpu-signer-${{ github.sha }}
          path: ${{ runner.temp }}/scribe-reviewed-signer-bundle
          if-no-files-found: error
          retention-days: 90
      - name: Record immutable artifact identity
        shell: pwsh
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_SHA256: ${{ steps.upload.outputs.artifact-digest }}
        run: |
          "Artifact ID: $env:ARTIFACT_ID" >> $env:GITHUB_STEP_SUMMARY
          "Artifact SHA-256: $env:ARTIFACT_SHA256" >> $env:GITHUB_STEP_SUMMARY
