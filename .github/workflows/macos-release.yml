name: Validate macOS release package

on:
  pull_request:
    paths:
      - '.github/workflows/macos-release.yml'
      - 'Cargo.lock'
      - 'Cargo.toml'
      - 'build.rs'
      - 'build_support/build_revision.rs'
      - 'build_support/*macos_cpu_component.py'
      - 'build_support/*macos_cpu_pkg_entry.py'
      - 'build_support/*macos_cpu_pkg.py'
      - 'build_support/*macos_metal_pkg_entry.py'
      - 'build_support/*macos_cpu_pkg_profile.py'
      - 'tests/build_revision_invalidation.rs'
      - 'installer/macos/**'
      - 'native/**'
      - 'runtime-manifests/gpu-*-macos-*.json'
      - 'scripts/*macos*'
      - 'src/**'
      - 'tools/worker-pack-author/**'
      - 'tools/macos-cpu-worker-installer/**'
      - 'tools/macos-metal-pack-installer/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/macos-release.yml'
      - 'Cargo.lock'
      - 'Cargo.toml'
      - 'build.rs'
      - 'build_support/build_revision.rs'
      - 'build_support/*macos_cpu_component.py'
      - 'build_support/*macos_cpu_pkg_entry.py'
      - 'build_support/*macos_cpu_pkg.py'
      - 'build_support/*macos_metal_pkg_entry.py'
      - 'build_support/*macos_cpu_pkg_profile.py'
      - 'tests/build_revision_invalidation.rs'
      - 'installer/macos/**'
      - 'native/**'
      - 'runtime-manifests/gpu-*-macos-*.json'
      - 'scripts/*macos*'
      - 'src/**'
      - 'tools/worker-pack-author/**'
      - 'tools/macos-cpu-worker-installer/**'
      - 'tools/macos-metal-pack-installer/**'
  workflow_dispatch:
    inputs:
      notarize:
        description: Run the protected official signing and notarization lane.
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  package-profile:
    name: macOS ${{ matrix.arch }} native PKG profile
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x86_64
          - runner: macos-15
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6; Python is authoring-only
        with:
          python-version: '3.13'
      - name: Observe fixed unsigned PKG fixture format without installation
        timeout-minutes: 2
        run: python3 -B build_support/test_macos_cpu_pkg_profile.py

  structural:
    name: macOS ${{ matrix.arch }} structural package validation
    needs: package-profile
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x86_64
          - runner: macos-15
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6; Python is authoring-only
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@01ba1edad32c6f80dbcce879d3e0fa5a00b2a84e # 1.96.0 branch reviewed 2026-08-27
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
          components: rustfmt, clippy
      - name: Prepare reviewed sherpa-onnx archives
        run: |
          archive_dir="$RUNNER_TEMP/scribe-sherpa-onnx"
          bash scripts/prepare-macos-release-inputs.sh --output-directory "$archive_dir"
          echo "SHERPA_ONNX_ARCHIVE_DIR=$archive_dir" >> "$GITHUB_ENV"
      - name: Verify CPU writer and package-entry source without installation
        run: |
          cargo fetch --locked --manifest-path tools/macos-cpu-worker-installer/Cargo.toml
          bash scripts/verify-macos-cpu-installer-source.sh
      - name: Verify non-installing CPU component source
        run: python3 -B build_support/test_macos_cpu_component.py
      - name: Verify CPU package-entry construction with mocked native tools
        run: |
          python3 -B build_support/test_macos_cpu_pkg_entry.py
          python3 -B build_support/test_native_macos_cpu_pkg_entry.py
      - name: Verify Metal package-entry construction with mocked native tools
        run: python3 -B build_support/test_macos_metal_pkg_entry.py
      - name: Verify CPU component PKG construction with mocked native tools
        run: python3 -B build_support/test_macos_cpu_pkg.py
      - name: Verify Metal writer source in private unprivileged fixtures
        timeout-minutes: 15
        run: |
          cargo fetch --locked --manifest-path tools/macos-metal-pack-installer/Cargo.toml
          bash scripts/verify-macos-metal-installer-source.sh
      - name: Validate canonical packaging inputs
        run: bash scripts/test-macos-release-packaging.sh
      - name: Run macOS runtime and worker-pack authoring tests
        env:
          SCRIBE_BUILD_REVISION: stage6-macos-ci
        run: |
          metadata_tests="$(cargo test --locked --bin local-transcriber macos_metal_metadata_ -- --list)"
          metadata_count="$(printf '%s\n' "$metadata_tests" | awk '/^onnx_worker::tests::macos_metal_metadata_.*: test$/ { count++ } END { print count+0 }')"
          test "$metadata_count" -eq 11
          directory_tests="$(cargo test --locked --bin local-transcriber macos_worker_launch::platform::tests::descriptor_directory_spawn_ -- --list)"
          directory_count="$(printf '%s\n' "$directory_tests" | awk '/^macos_worker_launch::platform::tests::descriptor_directory_spawn_.*: test$/ { count++ } END { print count+0 }')"
          test "$directory_count" -eq 2
          lifecycle_tests="$(cargo test --locked --bin local-transcriber macos_worker_lifecycle_ -- --list)"
          lifecycle_count="$(printf '%s\n' "$lifecycle_tests" | awk '/^macos_worker_launch::platform::tests::macos_worker_lifecycle_.*: test$/ { count++ } END { print count+0 }')"
          test "$lifecycle_count" -eq 10
          executable_tests="$(cargo test --locked --bin local-transcriber macos_exec_authority_ -- --list)"
          executable_count="$(printf '%s\n' "$executable_tests" | awk '/^(macos_worker_launch::platform::tests|gpu_worker_pack::launch_binding::macos_exec_authority_tests|onnx_worker::tests)::macos_exec_authority_.*: test$/ { count++ } END { print count+0 }')"
          test "$executable_count" -eq 4
          authority_tests="$(cargo test --locked --bin local-transcriber macos_worker_authority::tests:: -- --list)"
          authority_count="$(printf '%s\n' "$authority_tests" | awk '/^macos_worker_authority::tests::.*: test$/ { count++ } END { print count+0 }')"
          test "$authority_count" -eq 9
          filesystem_tests="$(cargo test --locked --bin local-transcriber macos_worker_fs::tests:: -- --list)"
          filesystem_count="$(printf '%s\n' "$filesystem_tests" | awk '/^macos_worker_fs::tests::.*: test$/ { count++ } END { print count+0 }')"
          test "$filesystem_count" -eq 8
          projection_tests="$(cargo test --locked --bin local-transcriber macos_protected_projection_ -- --list)"
          projection_count="$(printf '%s\n' "$projection_tests" | awk '/^gpu_worker_pack::protected_macos_projection_tests::macos_protected_projection_.*: test$/ { count++ } END { print count+0 }')"
          test "$projection_count" -eq 3
          cpu_tests="$(cargo test --locked --bin local-transcriber macos_protected_cpu_ -- --list)"
          cpu_count="$(printf '%s\n' "$cpu_tests" | awk '/^(macos_worker_layout::tests|macos_worker_authority::cpu_tests|macos_worker_launch::tests|onnx_worker::tests)::macos_protected_cpu_.*: test$/ { count++ } END { print count+0 }')"
          test "$cpu_count" -eq 14
          cargo test --locked --test build_revision_invalidation -- --test-threads=1
          cargo test --locked macos_ -- --nocapture
          cargo test --locked directional_digest_handshake_binds_parent_anchor_without_child_compile_time_comparison -- --nocapture
          cargo test --manifest-path tools/worker-pack-author/Cargo.toml --locked -- --test-threads=1
      - name: Check Metal worker feature and compile native Metal shim
        env:
          SCRIBE_BUILD_REVISION: stage6-macos-ci
        run: |
          env -u SCRIBE_MACOS_GPU_ROLLBACK_KEYCHAIN_ACCESS_GROUP \
            DOCS_RS=1 SCRIBE_BUILDING_WORKER=1 MACOSX_DEPLOYMENT_TARGET=13.0 \
            CARGO_TARGET_DIR="$RUNNER_TEMP/scribe-metal-source-check" \
            cargo check --locked --bin scribe-inference-worker --features metal-acceleration
      - name: Run native Metal metadata helper contract
        timeout-minutes: 45
        env:
          SCRIBE_BUILD_REVISION: stage6-macos-ci
        run: bash scripts/test-macos-metal-metadata-helper.sh
      - name: Build ad hoc signed universal structural package
        env:
          SCRIBE_BUILD_REVISION: ${{ github.sha }}
        run: |
          bash scripts/build-macos-release.sh --output-directory dist-macos --pack-version 0.1.0 --signing-mode adhoc --prepare-protected-cpu-component
          SCRIBE_MACOS_TEST_BUNDLE="$PWD/dist-macos/Scribe.app" bash scripts/test-macos-release-packaging.sh
      - name: Run protected CPU worker contract without installation
        timeout-minutes: 25
        env:
          SCRIBE_BUILD_REVISION: ${{ github.sha }}
        run: bash scripts/test-macos-protected-cpu-worker.sh --app "$PWD/dist-macos/Scribe.app"
      - name: Construct real universal CPU entry and private unsigned package without execution
        timeout-minutes: 50
        env:
          SCRIBE_BUILD_REVISION: ${{ github.sha }}
        run: |
          worker_sha256="$(shasum -a 256 "$PWD/dist-macos/Scribe.app/Contents/MacOS/scribe-inference-worker" | awk '{print $1}')"
          python3 -B build_support/native_macos_cpu_pkg_entry.py --app "$PWD/dist-macos/Scribe.app" --worker-sha256 "$worker_sha256" --build-revision "$SCRIBE_BUILD_REVISION"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: macos-${{ matrix.arch }}-structural-evidence
          path: dist-macos/Scribe-macos-universal.zip
          if-no-files-found: error

  official-sign-notarize:
    name: Protected official macOS signing and notarization
    if: github.event_name == 'workflow_dispatch' && inputs.notarize == true && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: structural
    runs-on: macos-15
    environment: macos-release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@01ba1edad32c6f80dbcce879d3e0fa5a00b2a84e # 1.96.0 branch reviewed 2026-08-27
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Prepare reviewed sherpa-onnx archives
        run: |
          archive_dir="$RUNNER_TEMP/scribe-sherpa-onnx"
          bash scripts/prepare-macos-release-inputs.sh --output-directory "$archive_dir"
          echo "SHERPA_ONNX_ARCHIVE_DIR=$archive_dir" >> "$GITHUB_ENV"
      - name: Import protected signing material into the ephemeral keychain
        env:
          SCRIBE_MACOS_SIGNING_IDENTITY: ${{ secrets.SCRIBE_MACOS_SIGNING_IDENTITY }}
          SCRIBE_MACOS_NOTARY_PROFILE: ${{ secrets.SCRIBE_MACOS_NOTARY_PROFILE }}
        run: |
          test -n "$SCRIBE_MACOS_SIGNING_IDENTITY"
          test -n "$SCRIBE_MACOS_NOTARY_PROFILE"
          security find-identity -v -p codesigning | grep -F -- "$SCRIBE_MACOS_SIGNING_IDENTITY" >/dev/null
          xcrun notarytool history --keychain-profile "$SCRIBE_MACOS_NOTARY_PROFILE" >/dev/null
      - name: Build protected CPU-only package pending Metal authoring trust provisioning
        env:
          SCRIBE_MACOS_SIGNING_IDENTITY: ${{ secrets.SCRIBE_MACOS_SIGNING_IDENTITY }}
          SCRIBE_MACOS_GPU_RELEASE_SECURITY_EPOCH: '0'
        run: bash scripts/build-macos-release.sh --output-directory dist-macos --pack-version 0.1.0 --signing-mode developer-id
      - name: Notarize and staple protected package
        env:
          SCRIBE_MACOS_SIGNING_IDENTITY: ${{ secrets.SCRIBE_MACOS_SIGNING_IDENTITY }}
          SCRIBE_MACOS_NOTARY_PROFILE: ${{ secrets.SCRIBE_MACOS_NOTARY_PROFILE }}
        run: bash scripts/sign-notarize-macos-release.sh --app dist-macos/Scribe.app --archive-output dist-macos/Scribe-macos-universal.zip
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: macos-notarized-universal-package
          path: dist-macos/Scribe-macos-universal.zip
          if-no-files-found: error
