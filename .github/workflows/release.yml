name: Build Windows installer

on:
  pull_request:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish a stable GitHub Release from the default branch after validation
        required: true
        type: boolean
        default: false
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: Build and verify Windows installer
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Test Windows release packaging contracts
        shell: pwsh
        run: |
          & .\scripts\test-windows-release-packaging.ps1

      - name: Install Rust
        # Official dtolnay/rust-toolchain branch 1.96.0 resolved on 2026-08-27;
        # the immutable revision is guarded by the packaging and Rust tests.
        uses: dtolnay/rust-toolchain@01ba1edad32c6f80dbcce879d3e0fa5a00b2a84e # 1.96.0 branch reviewed 2026-08-27
        with:
          # The toolchain action installs only rustc and cargo unless requested.
          # Keep the CI formatting and linting tools available for this pinned Rust release.
          components: rustfmt, clippy

      - name: Fetch locked Rust dependencies
        run: cargo fetch --locked

      - name: Prepare reviewed sherpa-onnx archive
        shell: pwsh
        env:
          SHERPA_ONNX_ARCHIVE_NAME: sherpa-onnx-v1.13.5-win-x64-static-MT-Release-lib.tar.bz2
          SHERPA_ONNX_ARCHIVE_SHA256: b7080b6f470bac96ef0afe56b25ae9b2f9f0ca82d10dad19bf3a2fc5ffd6cffc
          SHERPA_ONNX_ARCHIVE_SIZE: '120217991'
        run: |
          $archiveDir = Join-Path $env:GITHUB_WORKSPACE '.ci-native'
          $archivePath = Join-Path $archiveDir $env:SHERPA_ONNX_ARCHIVE_NAME
          New-Item -ItemType Directory -Force -Path $archiveDir | Out-Null
          $url = "https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.5/$env:SHERPA_ONNX_ARCHIVE_NAME"
          curl.exe --fail --location --retry 3 --retry-delay 2 --output $archivePath $url
          $file = Get-Item $archivePath
          if ($file.Length -ne [int64]$env:SHERPA_ONNX_ARCHIVE_SIZE) {
            throw "Unexpected sherpa-onnx archive size: $($file.Length)"
          }
          $actualSha256 = (Get-FileHash -Algorithm SHA256 -Path $archivePath).Hash.ToLowerInvariant()
          if ($actualSha256 -ne $env:SHERPA_ONNX_ARCHIVE_SHA256) {
            throw "Unexpected sherpa-onnx archive SHA-256: $actualSha256"
          }
          "SHERPA_ONNX_ARCHIVE_DIR=$archiveDir" >> $env:GITHUB_ENV

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --locked --all-features

      - name: Download and verify pinned release inputs
        shell: pwsh
        run: |
          & .\scripts\prepare-windows-release-inputs.ps1 -OutputDirectory .ci-release-inputs

      - name: Build validated portable payload
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"').Matches.Groups[1].Value
          if (-not $version) { throw "Could not read the package version from Cargo.toml" }
          "APP_VERSION=$version" >> $env:GITHUB_ENV
          & .\scripts\build-windows-release.ps1 `
            -ModelSource .ci-release-inputs\model\whisper-base.en-Q8_0.gguf `
            -BundlePath dist\portable

      - name: Acquire digest-pinned Inno Setup
        shell: pwsh
        # Reviewed source, size, digest, embedded-installer digest, and trust
        # scope are recorded in installer/inno-setup-6.7.1-provenance.json.
        env:
          INNO_NUPKG_SHA256: a0dad33db33099d9cd2b89ac2d08b5d70c589b15118ced3b95f469f044f99950
          INNO_NUPKG_SIZE: '10017031'
          INNO_INSTALLER_SHA256: 4d11e8050b6185e0d49bd9e8cc661a7a59f44959a621d31d11033124c4e8a7b0
          INNO_INSTALLER_SIZE: '10619024'
        run: |
          $packageRoot = Join-Path $env:GITHUB_WORKSPACE '.ci-tools\inno-package'
          $installRoot = Join-Path $env:GITHUB_WORKSPACE '.ci-tools\inno-setup'
          $packagePath = Join-Path $packageRoot 'InnoSetup.6.7.1.nupkg'
          New-Item -ItemType Directory -Path $packageRoot | Out-Null
          curl.exe --fail --location --retry 3 --retry-delay 2 `
            --output $packagePath `
            'https://community.chocolatey.org/api/v2/package/InnoSetup/6.7.1'
          if ($LASTEXITCODE -ne 0) { throw 'Failed to download InnoSetup.6.7.1.nupkg' }
          $package = Get-Item -LiteralPath $packagePath
          if ($package.Length -ne [int64]$env:INNO_NUPKG_SIZE) {
            throw "Unexpected Inno Setup nupkg size: $($package.Length)"
          }
          $packageHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $packagePath).Hash.ToLowerInvariant()
          if ($packageHash -cne $env:INNO_NUPKG_SHA256) {
            throw "Unexpected Inno Setup nupkg SHA-256: $packageHash"
          }
          $expandedRoot = Join-Path $packageRoot 'expanded'
          Expand-Archive -LiteralPath $packagePath -DestinationPath $expandedRoot
          $installerPath = Join-Path $expandedRoot 'tools\innosetup-6.7.1.exe'
          $installer = Get-Item -LiteralPath $installerPath
          if ($installer.Length -ne [int64]$env:INNO_INSTALLER_SIZE) {
            throw "Unexpected embedded Inno Setup installer size: $($installer.Length)"
          }
          $installerHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $installerPath).Hash.ToLowerInvariant()
          if ($installerHash -cne $env:INNO_INSTALLER_SHA256) {
            throw "Unexpected embedded Inno Setup installer SHA-256: $installerHash"
          }
          & $installerPath /VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP- /NOICONS /CURRENTUSER "/DIR=$installRoot"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup installation failed with exit code $LASTEXITCODE" }
          $iscc = Join-Path $installRoot 'ISCC.exe'
          $isccVersion = (Get-Item -LiteralPath $iscc).VersionInfo.ProductVersion
          if ($isccVersion -notlike '6.7.1*') { throw "Expected Inno Setup 6.7.1; found $isccVersion" }
          "INNO_ISCC=$iscc" >> $env:GITHUB_ENV

      - name: Build and normalize Windows installer
        shell: pwsh
        run: |
          $iscc = $env:INNO_ISCC
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler not found at $iscc" }
          $isccVersion = (Get-Item -LiteralPath $iscc).VersionInfo.ProductVersion
          if ($isccVersion -notlike '6.7.1*') { throw "Expected Inno Setup 6.7.1; found $isccVersion" }
          & $iscc "/DAppVersion=$env:APP_VERSION" installer\scribe.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed with exit code $LASTEXITCODE" }
          $generated = @(Get-ChildItem -Path dist -Filter "Scribe-Setup-$env:APP_VERSION.exe" -File)
          if ($generated.Count -ne 1) { throw "Expected exactly one versioned installer; found $($generated.Count)" }
          Copy-Item -LiteralPath $generated[0].FullName -Destination dist\Scribe-Setup.exe -Force

      - name: Package portable ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path dist\portable\* -DestinationPath dist\Scribe-windows-x64.zip -Force

      - name: Verify portable and installer payload parity
        shell: pwsh
        run: |
          & .\scripts\verify-windows-release-package.ps1 `
            -BundlePath dist\portable `
            -PortableZipPath dist\Scribe-windows-x64.zip `
            -InstallerPath dist\Scribe-Setup.exe `
            -ExerciseStableUpgrade

      - name: Upload Windows release assets
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: windows-release-assets
          path: |
            dist/Scribe-Setup.exe
            dist/Scribe-windows-x64.zip
          if-no-files-found: error

  release:
    name: Create GitHub release
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_release == true &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    needs: build
    runs-on: windows-latest
    concurrency:
      group: windows-release-publication
      queue: max
    permissions:
      contents: write

    steps:
      - name: Check out release source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.sha }}

      - name: Resolve and validate release metadata
        id: release-metadata
        shell: pwsh
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          $versionMatches = @(Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"')
          if ($versionMatches.Count -ne 1) {
            throw "Expected exactly one package version in Cargo.toml; found $($versionMatches.Count)"
          }
          $version = $versionMatches[0].Matches.Groups[1].Value
          $derivedTag = "v$version"
          if ($derivedTag -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Cargo.toml package version must be an exact semantic version; received $version"
          }

          if ($env:GITHUB_EVENT_NAME -eq 'push') {
            $tag = $env:GITHUB_REF_NAME
            if ($tag -notmatch '^v\d+\.\d+\.\d+$') {
              throw "Release tags must be exact semantic versions such as v0.2.0; received $tag"
            }
            if ($tag -ne $derivedTag) {
              throw "Release tag $tag does not match Cargo.toml version $version"
            }
          } elseif ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
            $expectedRef = "refs/heads/$env:DEFAULT_BRANCH"
            if ($env:GITHUB_REF -ne $expectedRef) {
              throw "Manual release publication is restricted to the default branch $env:DEFAULT_BRANCH"
            }
            $tag = $derivedTag
          } else {
            throw "Unsupported release event $env:GITHUB_EVENT_NAME"
          }

          "tag=$tag" >> $env:GITHUB_OUTPUT
          "target_sha=$env:GITHUB_SHA" >> $env:GITHUB_OUTPUT

      - name: Refuse duplicate manual release
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release-metadata.outputs.tag }}
        run: |
          $savedNativeErrorPreference = $PSNativeCommandUseErrorActionPreference
          try {
            $PSNativeCommandUseErrorActionPreference = $false

            $null = & git ls-remote --exit-code --tags origin "refs/tags/$env:RELEASE_TAG" 2>$null
            $tagLookupExit = $LASTEXITCODE
            if ($tagLookupExit -eq 0) {
              throw "Tag $env:RELEASE_TAG already exists; refusing to overwrite it"
            }
            if ($tagLookupExit -ne 2) {
              throw "Could not confirm that tag $env:RELEASE_TAG is absent (git exit $tagLookupExit)"
            }

            $releaseLookup = @(& gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$env:RELEASE_TAG" --silent 2>&1)
            $releaseLookupExit = $LASTEXITCODE
            if ($releaseLookupExit -eq 0) {
              throw "Release $env:RELEASE_TAG already exists; refusing to overwrite it"
            }
            if (($releaseLookup -join "`n") -notmatch '\(HTTP 404\)') {
              throw "Could not confirm that release $env:RELEASE_TAG is absent: $($releaseLookup -join ' ')"
            }

            $global:LASTEXITCODE = 0
          }
          finally {
            $PSNativeCommandUseErrorActionPreference = $savedNativeErrorPreference
          }

      - name: Download verified release assets
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: windows-release-assets
          path: release-assets

      - name: Create release with generated notes
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release-metadata.outputs.tag }}
          RELEASE_SHA: ${{ steps.release-metadata.outputs.target_sha }}
        run: |
          $assetRoot = [System.IO.Path]::GetFullPath((Join-Path $PWD 'release-assets'))
          $expectedNames = @('Scribe-Setup.exe', 'Scribe-windows-x64.zip')
          $expectedPaths = @($expectedNames | ForEach-Object { Join-Path $assetRoot $_ })
          $assets = @(Get-ChildItem -LiteralPath $assetRoot -File -Recurse)
          if ($assets.Count -ne $expectedPaths.Count) {
            throw "Expected exactly $($expectedPaths.Count) release assets; found $($assets.Count)"
          }
          foreach ($expectedPath in $expectedPaths) {
            $matches = @($assets | Where-Object { $_.FullName -ceq $expectedPath })
            if ($matches.Count -ne 1) {
              throw "Expected exactly one canonical release asset at $expectedPath; found $($matches.Count)"
            }
          }

          $requiredRulesetName = 'Protect release tags'
          $requiredRulesetId = 21505050
          $requiredRulesetNodeId = 'RRS_lACqUmVwb3NpdG9yec5L6WbnzgFIJBo'
          $requiredRulesetUpdatedAt = '2026-08-25T18:57:12.727-05:00'
          $rulesetResponse = @(& gh api `
            -H 'X-GitHub-Api-Version: 2026-03-10' `
            "repos/$env:GITHUB_REPOSITORY/rulesets/$requiredRulesetId" 2>&1)
          $rulesetDetailExit = $LASTEXITCODE
          if ($rulesetDetailExit -ne 0) {
            throw "Could not read repository ruleset $requiredRulesetName; refusing publication: $($rulesetResponse -join ' ')"
          }
          try {
            $ruleset = ($rulesetResponse -join "`n") | ConvertFrom-Json -Depth 100
          } catch {
            throw "Could not parse repository ruleset $requiredRulesetName; refusing publication: $($_.Exception.Message)"
          }
          foreach ($requiredProperty in @('id', 'node_id', 'updated_at', 'name', 'target', 'source_type', 'source', 'enforcement', 'current_user_can_bypass', 'conditions', 'rules')) {
            if ($null -eq $ruleset.PSObject.Properties[$requiredProperty]) {
              throw "Repository ruleset $requiredRulesetName is missing required property $requiredProperty"
            }
          }
          if ($ruleset.id -ne $requiredRulesetId -or
              $ruleset.node_id -cne $requiredRulesetNodeId -or
              $ruleset.updated_at -cne $requiredRulesetUpdatedAt -or
              $ruleset.name -cne $requiredRulesetName -or
              $ruleset.target -cne 'tag' -or
              $ruleset.source_type -cne 'Repository' -or
              $ruleset.source -cne $env:GITHUB_REPOSITORY -or
              $ruleset.enforcement -cne 'active') {
            throw "Ruleset $requiredRulesetName must be an active tag ruleset owned by $env:GITHUB_REPOSITORY"
          }
          $conditionNames = @($ruleset.conditions.PSObject.Properties.Name)
          if ($null -eq $ruleset.conditions -or
              $conditionNames.Count -ne 1 -or
              $conditionNames[0] -cne 'ref_name') {
            throw "Repository ruleset $requiredRulesetName must define only ref-name conditions"
          }
          $refName = $ruleset.conditions.ref_name
          $refNamePropertyNames = @($refName.PSObject.Properties.Name | Sort-Object)
          if ($null -eq $refName -or
              $refNamePropertyNames.Count -ne 2 -or
              $refNamePropertyNames[0] -cne 'exclude' -or
              $refNamePropertyNames[1] -cne 'include' -or
              $refName.include -isnot [System.Array] -or
              $refName.exclude -isnot [System.Array]) {
            throw "Repository ruleset $requiredRulesetName must define unambiguous ref includes and exclusions"
          }
          $includedRefs = @($refName.include)
          $excludedRefs = @($refName.exclude)
          if ($includedRefs.Count -ne 1 -or $includedRefs[0] -cne 'refs/tags/v*') {
            throw "Repository ruleset $requiredRulesetName must include exactly refs/tags/v*"
          }
          if ($excludedRefs.Count -ne 0) {
            throw "Repository ruleset $requiredRulesetName must not exclude any refs"
          }
          if ($null -ne $ruleset.PSObject.Properties['bypass_actors'] -and
              ($ruleset.bypass_actors -isnot [System.Array] -or @($ruleset.bypass_actors).Count -ne 0)) {
            throw "Repository ruleset $requiredRulesetName must not allow bypass actors"
          }
          if ($ruleset.current_user_can_bypass -cne 'never') {
            throw "Repository ruleset $requiredRulesetName must not allow the workflow token to bypass"
          }
          if ($ruleset.rules -isnot [System.Array]) {
            throw "Repository ruleset $requiredRulesetName must define an unambiguous rules array"
          }
          $ruleTypes = @($ruleset.rules | ForEach-Object {
            if ($null -eq $_.PSObject.Properties['type'] -or $_.type -isnot [string]) {
              throw "Repository ruleset $requiredRulesetName contains a rule without a valid type"
            }
            $_.type
          })
          if ($ruleTypes.Count -ne 2 -or
              @($ruleTypes | Where-Object { $_ -ceq 'update' }).Count -ne 1 -or
              @($ruleTypes | Where-Object { $_ -ceq 'deletion' }).Count -ne 1) {
            throw "Repository ruleset $requiredRulesetName must contain exactly update and deletion rules"
          }

          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
            $createTagResult = @(& gh api --method POST "repos/$env:GITHUB_REPOSITORY/git/refs" `
              -f "ref=refs/tags/$env:RELEASE_TAG" `
              -f "sha=$env:RELEASE_SHA" `
              --silent 2>&1)
            $createTagExit = $LASTEXITCODE
            if ($createTagExit -ne 0) {
              throw "Could not atomically create tag $env:RELEASE_TAG at $env:RELEASE_SHA; refusing publication: $($createTagResult -join ' ')"
            }

            $remoteRef = @(& gh api "repos/$env:GITHUB_REPOSITORY/git/ref/tags/$env:RELEASE_TAG" `
              --jq '.object.type + " " + .object.sha' 2>&1)
            $remoteRefExit = $LASTEXITCODE
            if ($remoteRefExit -ne 0 -or $remoteRef.Count -ne 1) {
              throw "Could not verify newly created tag $env:RELEASE_TAG; refusing publication: $($remoteRef -join ' ')"
            }
            $remoteRefParts = $remoteRef[0] -split ' ', 2
            if ($remoteRefParts.Count -ne 2 -or
                $remoteRefParts[0] -cne 'commit' -or
                $remoteRefParts[1] -cne $env:RELEASE_SHA) {
              throw "New tag $env:RELEASE_TAG does not resolve exactly to commit $env:RELEASE_SHA; received $($remoteRef -join ' ')"
            }
          } else {
            $remoteRefs = @(& git ls-remote --exit-code origin `
              "refs/tags/$env:RELEASE_TAG" `
              "refs/tags/$env:RELEASE_TAG^{}" 2>&1)
            $remoteRefsExit = $LASTEXITCODE
            if ($remoteRefsExit -ne 0) {
              throw "Could not read pushed tag $env:RELEASE_TAG; refusing publication: $($remoteRefs -join ' ')"
            }
            $parsedRemoteRefs = @($remoteRefs | ForEach-Object {
              $parts = $_ -split '\s+', 2
              if ($parts.Count -eq 2) {
                [pscustomobject]@{ Sha = $parts[0]; Ref = $parts[1] }
              }
            })
            $directTags = @($parsedRemoteRefs | Where-Object { $_.Ref -ceq "refs/tags/$env:RELEASE_TAG" })
            $peeledTags = @($parsedRemoteRefs | Where-Object { $_.Ref -ceq "refs/tags/$env:RELEASE_TAG^{}" })
            if ($directTags.Count -ne 1 -or $peeledTags.Count -gt 1) {
              throw "Expected one remote tag and at most one peeled tag for $env:RELEASE_TAG"
            }
            $resolvedTagSha = if ($peeledTags.Count -eq 1) { $peeledTags[0].Sha } else { $directTags[0].Sha }
            if ($resolvedTagSha -cne $env:RELEASE_SHA) {
              throw "Pushed tag $env:RELEASE_TAG resolves to $resolvedTagSha instead of workflow commit $env:RELEASE_SHA"
            }
          }

          gh release create $env:RELEASE_TAG $expectedPaths `
            --draft=false `
            --generate-notes `
            --latest `
            --prerelease=false `
            --title $env:RELEASE_TAG `
            --verify-tag
